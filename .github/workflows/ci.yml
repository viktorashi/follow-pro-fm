name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    env:
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - uses: docker/setup-buildx-action@v3

      - name: Restore ffmpeg cache
        uses: actions/cache@v4
        with:
          path: |
            bin/ffmpeg
            bin/ffprobe
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('mise-tasks/ffmpeg/build', 'third_party/ffmpeg/configure', 'third_party/ffmpeg/fftools/ffmpeg.c', 'third_party/ffmpeg/libavcodec/allcodecs.c') }}

      - name: Restore Go build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml', '.golangci.yaml') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Restore OpenTofu cache
        uses: actions/cache@v4
        with:
          path: |
            terraform/.terraform
          key: tofu-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            tofu-${{ runner.os }}-

      - name: Build production app image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: profm-app-ci:local
          cache-from: type=gha,scope=app-image
          cache-to: type=gha,mode=max,scope=app-image

      - name: Build Whisper test image
        uses: docker/build-push-action@v6
        with:
          context: ./whisper-server
          load: true
          tags: profm-whisper-test:local
          cache-from: type=gha,scope=whisper-image
          cache-to: type=gha,mode=max,scope=whisper-image

      - name: Run the same checks as local
        timeout-minutes: 15
        run: mise run ci
        env:
          PROFM_APP_IMAGE_READY: "1"
          WHISPER_TEST_IMAGE_READY: "1"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
