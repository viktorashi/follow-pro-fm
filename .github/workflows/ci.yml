name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOTESTSUM_VERSION: v1.13.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"

      - uses: docker/setup-buildx-action@v3

      - name: Restore ffmpeg cache
        uses: actions/cache@v4
        with:
          path: |
            bin/ffmpeg
            bin/ffprobe
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build_ffmpeg.sh', 'third_party/ffmpeg/configure', 'third_party/ffmpeg/fftools/ffmpeg.c', 'third_party/ffmpeg/libavcodec/allcodecs.c') }}

      - name: Restore golangci-lint binary cache
        id: golangci-lint-bin-cache
        uses: actions/cache@v4
        with:
          path: bin/golangci-lint
          key: golangci-lint-bin-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}

      - name: Install golangci-lint
        if: steps.golangci-lint-bin-cache.outputs.cache-hit != 'true'
        run: |
          version="${GOLANGCI_LINT_VERSION#v}"
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${version}-linux-amd64.tar.gz" | tar -xz --strip-components=1 -C bin "golangci-lint-${version}-linux-amd64/golangci-lint"

      - name: Restore golangci-lint data cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-data-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            golangci-lint-data-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-

      - name: droast — Dockerfile linter
        uses: immanuwell/dockerfile-roast@1.4.7

      - name: Restore gotestsum binary cache
        id: gotestsum-bin-cache
        uses: actions/cache@v4
        with:
          path: bin/gotestsum
          key: gotestsum-bin-${{ runner.os }}-${{ env.GOTESTSUM_VERSION }}

      - name: Install gotestsum
        if: steps.gotestsum-bin-cache.outputs.cache-hit != 'true'
        run: |
          version="${GOTESTSUM_VERSION#v}"
          curl -sSfL "https://github.com/gotestyourself/gotestsum/releases/download/${GOTESTSUM_VERSION}/gotestsum_${version}_linux_amd64.tar.gz" | tar -xz -C bin gotestsum

      - name: Build production app image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: profm-app-ci:local
          cache-from: type=gha,scope=app-image
          cache-to: type=gha,mode=max,scope=app-image

      - name: Build Whisper test image
        uses: docker/build-push-action@v6
        with:
          context: ./whisper-server
          load: true
          tags: profm-whisper-test:local
          cache-from: type=gha,scope=whisper-image
          cache-to: type=gha,mode=max,scope=whisper-image

      - name: Run the same checks as local
        timeout-minutes: 15
        run: ./scripts/ci.sh
        env:
          PROFM_APP_IMAGE_READY: "1"
          WHISPER_TEST_IMAGE_READY: "1"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
