name: Deploy to Fly.io

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only deploy if CI passed and it was a push (not a PR)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Verify tested commit is still main
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${{ github.event.workflow_run.head_sha }}"

      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Authenticate Docker with Fly registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push production app image
        run: |
          docker build -t registry.fly.io/pro-fm-poller:${{ github.event.workflow_run.head_sha }} -t registry.fly.io/pro-fm-poller:latest .
          docker push registry.fly.io/pro-fm-poller:${{ github.event.workflow_run.head_sha }}
          docker push registry.fly.io/pro-fm-poller:latest

      - name: Build and push Whisper image
        run: |
          docker build -t registry.fly.io/pro-fm-whisper:${{ github.event.workflow_run.head_sha }} -t registry.fly.io/pro-fm-whisper:latest whisper-server
          docker push registry.fly.io/pro-fm-whisper:${{ github.event.workflow_run.head_sha }}
          docker push registry.fly.io/pro-fm-whisper:latest

      - name: OpenTofu Init
        run: mise run tofu:init
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: OpenTofu Apply
        run: |
          mise run tofu:apply -- -auto-approve \
            -var="poller_image=registry.fly.io/pro-fm-poller:${{ github.event.workflow_run.head_sha }}" \
            -var="whisper_image=registry.fly.io/pro-fm-whisper:${{ github.event.workflow_run.head_sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
