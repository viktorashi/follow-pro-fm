name: Deploy to Fly.io

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Authenticate Docker with Fly registry
        if: hashFiles('terraform/poller.tf') != ''
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push production app image
        if: hashFiles('terraform/poller.tf') != ''
        run: |
          docker build -t registry.fly.io/pro-fm-poller:${{ github.sha }} -t registry.fly.io/pro-fm-poller:latest .
          docker push registry.fly.io/pro-fm-poller:${{ github.sha }}
          docker push registry.fly.io/pro-fm-poller:latest

      - name: Build and push Whisper image
        if: hashFiles('terraform/poller.tf') != ''
        run: |
          docker build -t registry.fly.io/pro-fm-whisper:${{ github.sha }} -t registry.fly.io/pro-fm-whisper:latest whisper-server
          docker push registry.fly.io/pro-fm-whisper:${{ github.sha }}
          docker push registry.fly.io/pro-fm-whisper:latest

      - name: OpenTofu Init
        run: mise run tofu:init
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: OpenTofu Apply
        run: |
          mise run tofu:apply -- -auto-approve \
            -var="poller_image=registry.fly.io/pro-fm-poller:${{ github.sha }}" \
            -var="whisper_image=registry.fly.io/pro-fm-whisper:${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
