version: '3.8'

services:
  pro-fm-poller:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TRANSCRIPTION_URL=http://whisper:8000/v1/audio/transcriptions
      - TRANSCRIPTION_WS_URL=ws://whisper:8000/v1/audio/transcriptions
      - BASE_URL=http://localhost:8080
    volumes:
      - ./data:/data
    depends_on:
      - whisper

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=base
    volumes:
      - whisper_models:/root/.cache/huggingface

volumes:
  whisper_models:
