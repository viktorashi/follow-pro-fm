version: '3.8'

services:
  pro-fm-poller:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=dev
      - TRANSCRIPTION_URL=http://whisper:8000/v1/audio/transcriptions
      - TRANSCRIPTION_WS_URL=ws://whisper:8000/v1/audio/transcriptions
      - BASE_URL=http://localhost:8080
    volumes:
      - ./data:/data
    depends_on:
      whisper:
        condition: service_healthy

  whisper:
    build: ./whisper-server
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
