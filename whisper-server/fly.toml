app = "pro-fm-whisper"
primary_region = "fra"

[build]
dockerfile = "Dockerfile"

[env]
UVICORN_HOST = "0.0.0.0"
LOOPBACK_HOST_URL = "http://127.0.0.1:8000"
ENABLE_UI = "false"
WHISPER__INFERENCE_DEVICE = "cpu"
WHISPER__COMPUTE_TYPE = "int8"
WHISPER__CPU_THREADS = "1"
OMP_NUM_THREADS = "1"

[deploy]
strategy = "rolling"

[http_service]
internal_port = 8000
force_https = false
auto_stop_machines = false
auto_start_machines = true
max_machines_running = 1
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "90s"
interval = "15s"
timeout = "30s"
method = "GET"
path = "/health"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
