min_version = "2026.8.3"

[settings]
lockfile = true

[tools]
go = "1.26.4"
"go:github.com/a-h/templ/cmd/templ" = "v0.3.1020"
"go:golang.org/x/tools/gopls" = "v0.23.0"
golangci-lint = "2.12.2"
gotestsum = "1.13.0"
hadolint = "2.15.1"
flyctl = "0.4.59"
"aqua:docker/cli" = "29.7.2"
clang = "22.1.8"
make = "4.4.1"
perl = "5.44.0.0"
"conda:bash" = "5.2.37"
"conda:coreutils" = "9.11"
"conda:curl" = "8.21.0"
"conda:findutils" = "4.10.0"
"conda:gawk" = "5.4.1"
"conda:git" = "2.55.0"
"conda:grep" = "3.12"
"conda:sed" = "4.10"

[env]
_.path = ["{{ config_root }}/bin"]

[task_config]
includes = ["mise-tasks"]
