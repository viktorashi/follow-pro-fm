# fly.toml - Fly.io application configuration
# See https://fly.io/docs/reference/configuration/

app = 'pro-fm-poller'
primary_region = 'fra'  # Frankfurt (FRA) - closest available to Romania

[build]

[env]
TZ = 'Europe/Bucharest'

# Persistent volume for everything the app needs
[mounts]
source = 'pro_fm_data'
destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
